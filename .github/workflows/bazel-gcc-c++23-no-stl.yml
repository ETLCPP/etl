name: bazel-gcc-c++23-no-stl
on:
  push:
    branches: [ master, development, pull-request/* ]
    paths:
      - '.github/workflows/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel*'
      - 'meson.build'
      - 'meson_options.txt'
      - 'subprojects/**'
      - '.devcontainer/**'
  pull_request:
    branches: [ master, development, pull-request/* ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel*'
      - 'meson.build'
      - 'meson_options.txt'
      - 'subprojects/**'
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-bazel-gcc-cpp23-no-stl:
    name: Bazel GCC C++23 Linux - No STL
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6.0.3

    - name: Build
      run: bazel build //test:etl_tests --cxxopt=-std=c++23 --copt=-DETL_NO_STL --//:etl_profile=//:no_profile

    - name: Run tests
      run: bazel test //test:etl_tests --cxxopt=-std=c++23 --copt=-DETL_NO_STL  --//:etl_profile=//:no_profile --test_output=all
