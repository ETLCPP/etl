name: msvc
on:
  push:
    branches: [ master, development, pull-request/* ]
    paths:
      - '.github/workflows/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel*'
      - 'meson.build'
      - 'meson_options.txt'
      - 'subprojects/**'
      - '.devcontainer/**'
  pull_request:
    branches: [ master, development, pull-request/* ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - 'include/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel*'
      - 'meson.build'
      - 'meson_options.txt'
      - 'subprojects/**'
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-msvc-stl:
    name: Windows - STL - C++${{ matrix.cxx_standard }}
    runs-on: [windows-2022]
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [14, 17, 20]

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      run: |
        cmake -G "Visual Studio 17 2022" -AWin32 -DBUILD_TESTS=ON -DNO_STL=OFF -DETL_USE_TYPE_TRAITS_BUILTINS=OFF -DETL_USER_DEFINED_TYPE_TRAITS=OFF -DETL_FORCE_TEST_CPP03_IMPLEMENTATION=OFF -DETL_CXX_STANDARD=${{ matrix.cxx_standard }} ./
        MSBuild.exe -version
        MSBuild.exe .\etl.sln
        
    - name: Run tests
      run: test/Debug/etl_tests.exe -v

  build-windows-msvc-no-stl:
    name: Windows - No STL - C++${{ matrix.cxx_standard }}
    runs-on: [windows-2022]
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [14, 17, 20]
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      run: |
        cmake -G "Visual Studio 17 2022" -AWin32 -DBUILD_TESTS=ON -DNO_STL=ON -DETL_USE_TYPE_TRAITS_BUILTINS=OFF -DETL_USER_DEFINED_TYPE_TRAITS=OFF -DETL_FORCE_TEST_CPP03_IMPLEMENTATION=OFF -DETL_CXX_STANDARD=${{ matrix.cxx_standard }} ./
        MSBuild.exe -version
        MSBuild.exe .\etl.sln
        
    - name: Run tests
      run: test/Debug/etl_tests.exe -v

  build-windows-msvc-stl-force-cpp03:
    name: Windows - STL - Force C++03 - C++${{ matrix.cxx_standard }}
    runs-on: [windows-2022]
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [14, 17, 20]

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      run: |
        cmake -G "Visual Studio 17 2022" -AWin32 -DBUILD_TESTS=ON -DNO_STL=OFF -DETL_USE_TYPE_TRAITS_BUILTINS=OFF -DETL_USER_DEFINED_TYPE_TRAITS=OFF -DETL_FORCE_TEST_CPP03_IMPLEMENTATION=ON -DETL_CXX_STANDARD=${{ matrix.cxx_standard }} ./
        MSBuild.exe -version
        MSBuild.exe .\etl.sln

    - name: Run tests
      run: test/Debug/etl_tests.exe -v
        
  build-windows-msvc-no-stl-force-cpp03:
    name: Windows - No STL - Force C++03 - C++${{ matrix.cxx_standard }}
    runs-on: [windows-2022]
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [14, 17, 20]

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      run: |
        cmake -G "Visual Studio 17 2022" -AWin32 -DBUILD_TESTS=ON -DNO_STL=ON -DETL_USE_TYPE_TRAITS_BUILTINS=OFF -DETL_USER_DEFINED_TYPE_TRAITS=OFF -DETL_FORCE_TEST_CPP03_IMPLEMENTATION=ON -DETL_CXX_STANDARD=${{ matrix.cxx_standard }} ./
        MSBuild.exe -version
        MSBuild.exe .\etl.sln

    - name: Run tests
      run: test/Debug/etl_tests.exe -v
