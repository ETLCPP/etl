name: Deploy documentation via SFTP

on:
  push:
    branches:
      - feature/sftp-documentation-on-push-to-master

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./hugo

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Install and set up Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Build the static site
      - name: Build Hugo Site
        run: hugo --cleanDestinationDir --minify --baseURL "https://www.etlcpp.com/hugo/"

      # Securely upload the files via SCP/SFTP
      - name: SFTP Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DOCS_SSH_SERVER }}
          username: ${{ secrets.DOCS_SSH_USER }}
          key: ${{ secrets.DOCS_DEPLOY_KEY }}
          port: ${{ secrets.DOCS_SSH_PORT }}
          source: "./hugo/public/*"
          target: ${{ secrets.DOCS_DEST_DIR }}
          strip_components: 2 # Strips './hugo/public' so only the compiled HTML/assets are uploaded directly into target
