{{ with .Page.Sections.ByTitle }}
  <h3>Categories</h3>
  <ul>
    {{ range . }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}

{{ end }}

    {{ end }}
  </ul>
{{ end }}
